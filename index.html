<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoGlow Launch: Business Management Strategy Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f172a;--paper:#1e293b;--ink:#f8fafc;--mut:#94a3b8;--brand:#6366f1;--coral:#fb7185;--sun:#fbbf24;--mint:#34d399;--sky:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}

.splash {position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:splashFade 2s forwards;pointer-events:none;padding:20px;text-align:center;}
.splash h1 {font-size:clamp(2rem, 5vw, 4rem);margin-bottom:16px;color:var(--ink);}
.splash p {font-size:clamp(1.2rem, 3vw, 1.8rem);color:var(--mut);margin:0;}
@keyframes splashFade {0%, 80% {opacity:1;visibility:visible} 100% {opacity:0;visibility:hidden}}

.bar{position:sticky;top:0;z-index:5;height:4px;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}
.wrap{max-width:980px;margin:20px auto;padding:0 16px}
.play .wrap{margin-top:16px}
main{padding:28px 36px;min-height:auto;background:var(--paper);border:1px solid rgba(255,255,255,0.05);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.4)}
main.q{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 80px)}
main.ani{animation:rise .6s cubic-bezier(0.16,1,0.3,1) both}
main p{margin:0 0 12px;max-width:66ch}
h2{margin:0 0 12px;font-size:1.8rem;font-weight:700;line-height:1.2}
h3{margin:0 0 10px;font-size:1.2rem;font-weight:600}
main a{color:var(--brand);font-weight:600;text-decoration:none;transition:color 0.2s}
main a:hover{color:var(--sky)}
.scene{margin:0 0 16px;padding:12px 16px;background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.15);border-radius:12px;font-style:italic}
.callout{margin:16px 0;padding:12px 16px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.15);border-radius:12px}
.hero{display:flex;align-items:center;gap:20px;margin-bottom:16px;padding:20px 24px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.15);border-radius:20px}
.hero h2{margin-bottom:6px}.hero p{margin:0}
.earbud{font-size:2.8rem;animation:float 4s ease-in-out infinite}
.chips{margin:12px 0 20px}.chips span{display:inline-block;margin:0 6px 8px 0;padding:4px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:999px;font-size:.88rem;transition:all 0.3s}
.chips span:hover{background:rgba(255,255,255,0.1)}
label{display:block;font-weight:600}
input{width:100%;max-width:360px;margin-top:8px;padding:12px 16px;font:inherit;color:var(--ink);background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.2);border-radius:12px;transition:all 0.3s}
input:focus{background:rgba(255,255,255,0.06);border-color:var(--brand)}
.qtop{text-align:center;max-width:720px;margin:0 auto 16px}
.qtop .sc{margin:0 auto 8px;color:var(--mut);font-size:.9rem;font-style:italic}.qtop h2{margin:0;font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;counter-reset:t}
main.q .grid{flex:none;grid-auto-rows:1fr}
.card{counter-increment:t;position:relative;display:flex;align-items:center;padding:16px 50px 16px 20px;text-align:left;font:inherit;font-size:1.05rem;line-height:1.3;color:var(--ink);background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,0.1);cursor:pointer;transition:all .3s cubic-bezier(.25,.8,.25,1)}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);box-shadow:0 8px 20px rgba(0,0,0,0.3)}
.card:before{content:counter(t);position:absolute;top:50%;right:16px;transform:translateY(-50%);width:28px;height:28px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);border-radius:50%;text-align:center;line-height:26px;font-size:.85rem;font-weight:600;transition:all 0.3s}
.card b{font-weight:600}
.has .card:not(.sel){opacity:.4;transform:scale(0.98)}
.card.sel{transform:translateY(-2px);background:rgba(99,102,241,0.1);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand), 0 8px 16px rgba(99,102,241,0.2)}
.card.sel:before{content:"\2713";background:var(--brand);color:#fff;border-color:var(--brand)}
.chat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.bub{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:16px 16px 16px 6px;font-size:.88rem;line-height:1.3;animation:rise .5s cubic-bezier(0.16,1,0.3,1) both}
.bub:nth-child(2){animation-delay:.15s}.bub:nth-child(3){animation-delay:.3s}
.av{flex:none;display:grid;place-items:center;width:30px;height:30px;background:rgba(251,191,36,0.2);border:1px solid rgba(251,191,36,0.3);border-radius:50%;font-weight:700;font-size:.85rem}
.bub:nth-child(2) .av{background:rgba(52,211,153,0.2);border-color:rgba(52,211,153,0.3)}.bub:nth-child(3) .av{background:rgba(56,189,248,0.2);border-color:rgba(56,189,248,0.3)}
.bub small{display:block;font-weight:600;color:var(--mut);margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:20px}
main.q .grid+.foot,main.q .chat+.foot{margin-top:20px}
.sect{display:flex;align-items:center;gap:16px}.sect small{display:block;color:var(--mut);font-size:.8rem;line-height:1.2}.sect b{font-size:1rem;line-height:1.3}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;background:rgba(255,255,255,0.1);border-radius:50%;transition:all 0.3s}.dots .dn{background:var(--mint)}.dots .on{background:var(--brand);width:20px;border-radius:8px}
.btns,.row{display:flex;gap:12px}
.row{justify-content:space-between;align-items:center;margin-top:24px}
.pri,.sec{min-height:44px;padding:10px 24px;font:inherit;font-size:1rem;font-weight:600;border:none;border-radius:12px;cursor:pointer;transition:all .3s cubic-bezier(.25,.8,.25,1)}
.pri{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,0.3)}
.sec{background:rgba(255,255,255,0.05);color:var(--ink)}
.pri:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.5)}
.sec:hover{transform:translateY(-2px);background:rgba(255,255,255,0.1)}
.pri:active:not(:disabled),.sec:active{transform:translateY(0);box-shadow:none}
.pri:disabled{background:rgba(255,255,255,0.05);color:var(--mut);box-shadow:none;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.panel{padding:20px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.rv{display:flex;align-items:center;gap:16px;margin-bottom:12px;animation:rise .5s cubic-bezier(0.16,1,0.3,1) both}.rv a{margin-left:auto}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:24px;margin-bottom:24px;padding:24px 28px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.15);border-radius:20px}
.top p{margin:0}
.ring{--p:0;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),rgba(255,255,255,0.05) 0);box-shadow:0 0 20px rgba(0,0,0,0.2)}
.ring:before{content:"";position:absolute;inset:8px;background:var(--paper);border-radius:50%}
.ring b,.ring small{position:relative;line-height:1.1}.ring b{font-size:2rem}
.big{margin:4px 0!important;font-size:2rem;font-weight:700}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.ok{background:rgba(52,211,153,0.05);border-color:rgba(52,211,153,0.2)}.no{background:rgba(251,113,133,0.05);border-color:rgba(251,113,133,0.2)}
.pn{animation:rise .6s cubic-bezier(0.16,1,0.3,1) both}.pn:nth-child(2){animation-delay:.15s}.pn:nth-child(3){animation-delay:.3s}.pn:nth-child(4){animation-delay:.45s}
.kl{display:flex;justify-content:space-between;gap:12px;margin:14px 0 6px}
.mb{height:8px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden}.mb i{display:block;height:100%;width:0;background:var(--brand);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.it{margin:12px 0;padding:12px 16px;background:rgba(255,255,255,0.02);border-left:4px solid;border-radius:8px 16px 16px 8px;animation:rise .5s cubic-bezier(0.16,1,0.3,1) both}.it.good{border-color:var(--mint)}.it.bad{border-color:var(--coral)}
.good{color:var(--mint)}.bad{color:var(--coral)}
.launch{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;color:#fff;background:rgba(15,23,42,0.9);backdrop-filter:blur(8px);animation:fade .4s ease}
.launch h2{color:#fff;margin-top:20px;font-weight:500;letter-spacing:0.5px}
.rk{font-size:4rem;animation:float 2s ease-in-out infinite}
.lb{width:min(320px,80vw);height:6px;margin:24px auto 0;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden}.lb i{display:block;height:100%;width:0;background:var(--sky);transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--sky)}
.fx{position:fixed;top:-30px;z-index:50;width:8px;height:12px;border-radius:4px;pointer-events:none;animation:fall linear forwards;box-shadow:0 0 8px currentColor}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0;backdrop-filter:blur(0)}to{opacity:1;backdrop-filter:blur(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}
@media(max-width:760px){
 main{padding:24px 20px;border-radius:20px;min-height:0}
 main.q{min-height:0}
 .hero{flex-direction:column;text-align:center;padding:20px}
 .qtop h2{font-size:1.6rem}
 .grid{grid-template-columns:1fr}main.q .grid{grid-auto-rows:auto}
 .card{min-height:70px;padding:16px 50px 16px 16px}
 .res{grid-template-columns:1fr}.foot{justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div id="splash" class="splash">
    <h1>EcoGlow Launch 🌙</h1>
    <p>Business Management Strategy Simulator</p>
</div>

<div class="bar"><i id="bar"></i></div>
<div class="wrap"><main id="main"></main></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbznFpu_H16Nyt_sizjjApoZLX6n-r_9-Iw4qsoc_p_PhS5B-vcX5bQyJq0O8qmyxMbB/exec";

const D=[
{k:"price",n:"Pricing Strategy",ic:"💰",sc:"The finance director slides a spreadsheet across the table. Every number on it hangs on one thing: the price tag.",q:"How will you price EcoGlow?",o:[
{id:"skim",i:"💎",t:"Market Skimming at $149",p:100},
{id:"pen",i:"🏷️",t:"Penetration Pricing at $49",p:20},
{id:"comp",i:"⚖️",t:"Competitive Pricing at $99",p:65},
{id:"cost",i:"🧮",t:"Cost-Plus Pricing at $79",p:45}]},
{k:"place",n:"Place Strategy",ic:"🏬",sc:"A map of the city glows on the wall. Somewhere out there, your commuters are on their way to work. Where will they find you?",q:"Where will customers buy EcoGlow?",o:[
{id:"dtc",i:"🌐",t:"Direct-to-Consumer electronic commerce website and selective eco-boutique retailers",p:100},
{id:"mass",i:"🛒",t:"Mass Wholesale Supermarket Distribution",p:10},
{id:"pop",i:"🚉",t:"Pop-up kiosks in train stations and city commuter hubs",p:70},
{id:"chain",i:"🏪",t:"Specialist consumer electronics retail chains",p:40}]},
{k:"promo",n:"Promotion Strategy",ic:"📣",sc:"The creative team is buzzing. Two campaign folders sit on the table, and the launch date is getting closer.",q:"How will you promote EcoGlow?",o:[
{id:"btl",i:"📱",t:"Below-the-Line social media micro-influencer campaigns and sustainability Public Relations",p:100},
{id:"atl",i:"📺",t:"Above-the-Line national television and print advertising",p:15},
{id:"event",i:"🏖️",t:"Sponsorship of beach clean-up events and student campus tours",p:75},
{id:"disc",i:"🎟️",t:"Launch discount codes and buy-one-get-one offers",p:35}]},
{k:"evid",n:"Physical Evidence Strategy",ic:"📦",sc:"The first prototype box arrives from the factory. Before anyone hears a single note, they will hold the packaging.",q:"What will the packaging be?",o:[
{id:"bio",i:"🌱",t:"Biodegradable minimalist packaging",p:100},
{id:"plas",i:"✨",t:"Standard high-gloss plastic shell packaging",p:5},
{id:"card",i:"♻️",t:"Recycled cardboard box with a simple printed logo",p:65},
{id:"lux",i:"🎁",t:"Premium gift box with foam inserts and a magnetic lid",p:40}]}];
const CH=[["💼","Finance Director",["I ran the numbers twice. I need a third run.","My spreadsheet just sighed at that {x}.","Bold on {x}. I'll be keeping the receipts.","Somewhere, a calculator is quietly sweating.","I have questions, and none of them fit in one email."]],
["🌱","Sustainability Lead",["Interesting take on {x}. The oceans are watching.","I love it. I also have three concerns and a tote bag.","The turtles have opinions about our {x}.","Let's just say the planet raised an eyebrow.","I'll allow it, as long as nobody says 'eco-friendly' too loudly."]],
["📱","Social Media Intern",["Ooh, I can already see the memes for this one.","This will either go viral or go unnoticed. Both count as content.","I posted a poll about our {x}. It's split right down the middle.","No pressure, but the group chat is watching.","I've drafted eleven captions. Ten are unusable."]],
["🎩","Board Chair",["Hmm. I'll allow it. For now.","I have seen worse. I have also seen better.","Interesting {x}. Walk me through it at lunch.","The board will be taking notes. Lots of notes.","Let's see how this survives contact with the market."]],
["🚇","Daily Commuter",["I only care that my earbuds last the whole train ride.","I'd notice that on my way to work. Maybe.","My friends would ask me about this, so choose wisely.","I skim everything on the way in. Make it worth a glance.","If it's easy for me, I'm interested."]]];
const chat=k=>{const x=D.find(d=>d.k==k).n.toLowerCase();return[...CH].sort(()=>Math.random()-.5).slice(0,3).map(c=>`<div class="bub"><span class="av">${c[1][0]}</span><div><small>${c[1]}</small>${c[2][Math.random()*c[2].length|0].replace("{x}",x)}</div></div>`).join("")};

const has=(x,...v)=>v.includes(x);
const R=[
[75,"Synergy 1: A consistent green brand story","Biodegradable packaging, sustainability Public Relations and eco-boutique retailers all reinforce one sustainable identity.",a=>a.evid=="bio"&&a.promo=="btl"&&a.place=="dtc"],
[60,"Synergy 2: A premium digital route to market","Market skimming, online sales and micro-influencers reach affluent, digitally active buyers who accept a premium price.",a=>a.price=="skim"&&a.place=="dtc"&&a.promo=="btl"],
[40,"Synergy 3: Influencers feed the online shop","Micro-influencers send followers straight to the electronic commerce website, shortening the path to purchase.",a=>a.place=="dtc"&&a.promo=="btl"],
[35,"Synergy 4: Premium price, premium packaging","Packaging that feels special gives customers a visible reason to accept the skimming price.",a=>a.price=="skim"&&has(a.evid,"bio","lux")],
[25,"Synergy 5: A coherent mass-market plan","Low price, supermarket shelves and television advertising fit together, although this is not the target market for EcoGlow.",a=>a.price=="pen"&&a.place=="mass"&&a.promo=="atl"],
[30,"Synergy 6: Meeting commuters in person","Pop-up kiosks and sponsored events put EcoGlow in front of commuters where they live and travel.",a=>a.place=="pop"&&a.promo=="event"],
[30,"Synergy 7: Green from the box to the campaign","Sustainable packaging and sustainability-led promotion tell the same story to the same people.",a=>has(a.evid,"bio","card")&&has(a.promo,"btl","event")],
[25,"Synergy 8: A fair deal for commuters","A mid-range price sits comfortably with convenient, accessible places to buy.",a=>has(a.price,"comp","cost")&&has(a.place,"dtc","pop","chain")],
[20,"Synergy 9: Deals where people shop","Launch offers work best when shoppers can act on them in a physical shop.",a=>a.promo=="disc"&&has(a.place,"chain","mass")&&a.price!="skim"],
[-60,"Penalty 1: Greenwashing risk","Sustainability messages clash with high-gloss plastic packaging, which damages brand trust.",a=>a.evid=="plas"&&has(a.promo,"btl","event")],
[-40,"Penalty 2: Premium price in a mass channel","A $149 product on supermarket shelves lacks the setting that supports a premium price.",a=>a.price=="skim"&&a.place=="mass"],
[-30,"Penalty 3: Low price, costly advertising","National television advertising is hard to pay for with a low-margin $49 product.",a=>a.price=="pen"&&a.promo=="atl"],
[-25,"Penalty 4: Premium price, ordinary packaging","Standard plastic packaging fails to signal the quality that a $149 price promises.",a=>a.price=="skim"&&a.evid=="plas"],
[-20,"Penalty 5: Broad advertising, narrow channel","Television advertising wastes money when sales depend on a targeted online or pop-up channel.",a=>a.promo=="atl"&&has(a.place,"dtc","pop")],
[-20,"Penalty 6: Discounts cheapen a premium image","Constant discount codes work against a premium $149 price.",a=>a.promo=="disc"&&a.price=="skim"]];

function score(a){let base=0;D.forEach(d=>base+=d.o.find(o=>o.id==a[d.k]).p);const fx=R.filter(r=>r[3](a));return{base,fx,total:Math.max(0,base+fx.reduce((s,r)=>s+r[0],0))}}
const PASS=.5;
const MAX=Math.max(...D[0].o.flatMap(p=>D[1].o.flatMap(l=>D[2].o.flatMap(r=>D[3].o.map(e=>score({price:p.id,place:l.id,promo:r.id,evid:e.id}).total)))));
const ME=["Your marketing strategy perfectly aligned with your target market and budget.","Commuters are charging EcoGlow on train windowsills and telling strangers about it. The Chief Executive Officer has named a meeting room after you.","EcoGlow sold out so fast that the warehouse team asked for a hobby to fill their free time.","The sun is officially your best salesperson, and it works for free.","Your launch trended for three days. The marketing intern has stopped refreshing the dashboard and started framing it."];
const MG=["Your strategy landed well. It was not perfect, but the market liked it and the board is smiling politely.","Sales are healthy and the reviews are kind. The Chief Executive Officer said 'not bad', which in boardroom language is a standing ovation.","EcoGlow is a solid hit. A few things could be sharper, but nobody is hiding in the supply closet.","The earbuds are selling steadily, like a sunny day with a few passing clouds.","Commuters approve. Your team gets a pizza party and a gentle reminder to check the small print next time."];
const MF=["The market rejected your strategy. Your warehouse is full of unsold inventory, and the marketing team is currently hiding from the Chief Executive Officer in the supply closet.","The only people who bought EcoGlow were your relatives, and one of them asked for a refund.","Your earbuds are so unsold that the warehouse has started charging them rent.","Commuters walked past your launch as if it were a free flyer for a gym. Even the sun looks embarrassed.","The Chief Executive Officer asked for a strategy. The marketing team offered a hug and a very small spreadsheet.","Sales are so low that the solar charging case has finished a full charge and is now bored."];

const A={};let step=0,team="",res,note="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go=n=>{step=n;draw()};
let last=-1;const adv={};const pick=(k,id)=>{A[k]=id;adv[k]=chat(k);draw()};
const mix=()=>D.forEach(d=>{for(let i=d.o.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d.o[i],d.o[j]]=[d.o[j],d.o[i]]}});
const restart=()=>{Object.keys(A).forEach(k=>delete A[k]);Object.keys(adv).forEach(k=>delete adv[k]);mix();go(0)};

function draw(){
 $("bar").style.width=(step/6*100)+"%";
 document.body.classList.toggle("play",step>0);const m=$("main");m.classList.toggle("q",step>=1&&step<=4);m.innerHTML=step==0?brief():step<=4?decide(D[step-1]):step==5?review():results();
 if(last!=step){m.classList.remove("ani");void m.offsetWidth;m.classList.add("ani");last=step;window.scrollTo(0,0)}
 if(step==6)after();
}

function brief(){return`
<div style="margin-bottom:24px;">
    <label style="font-size:1.1rem;"><b>Enter your team name to begin:</b><br>
    <input maxlength="40" placeholder="Team Name" value="${esc(team)}" oninput="team=this.value.trim();$('start').disabled=team.length<2" style="font-size:1.1rem; padding:12px; margin-top:8px;"></label>
</div>
<div class="hero"><div class="earbud">🎧</div><div><h2>Launch Brief: EcoGlow 🌙</h2><p>Solar-powered wireless earbuds for eco-conscious urban commuters (Ages 18-35).</p></div></div>
<div class="chips"><span>☀️ Solar charging case</span><span>🌊 Recycled ocean plastic</span><span>🔋 Zero grid charging</span></div>
<div class="callout"><b>Your task:</b> Select one option for each Marketing Mix decision (Price, Place, Promotion, Physical Evidence). Align your choices to build a cohesive strategy.</div>
<div class="row"><span></span><button class="pri" id="start" onclick="go(1)" ${team.length<2?"disabled":""}>Start decisions 🚀</button></div>`}

function decide(d){return`<div class="qtop"><p class="sc">${d.sc}</p><h2>${d.q}</h2></div>
<div class="grid ${A[d.k]?"has":""}">${d.o.map(o=>`<button class="card ${A[d.k]==o.id?"sel":""}" onclick="pick('${d.k}','${o.id}')"><b>${o.t}</b></button>`).join("")}</div>
${adv[d.k]?`<div class="chat">${adv[d.k]}</div>`:""}
<div class="foot"><div class="sect"><div><small>Decision ${step} of 4</small><b>${d.n}</b></div><div class="dots">${[1,2,3,4].map(i=>`<i class="${i==step?"on":i<step?"dn":""}"></i>`).join("")}</div></div>
<div class="btns"><button class="sec" onclick="go(${step-1})">Back ⬅️</button><button class="pri" onclick="go(${step+1})" ${A[d.k]?"":"disabled"}>${step==4?"Review choices 📋":"Next ➡️"}</button></div></div>`}
function review(){return`<h2>Boardroom Review 📊</h2><div class="scene">The board is seated and your plan is on the screen. This is your last chance to change your mind.</div>
<p>Team <b>${esc(team)}</b>, here is your launch strategy.</p>
${D.map((d,i)=>{const o=d.o.find(o=>o.id==A[d.k]);return`<div class="panel rv" style="animation-delay:${i*.1}s"><div><small>${d.n}</small><br><b>${o.t}</b></div><a href="#" onclick="go(${i+1});return false">Change ✏️</a></div>`}).join("")}
<div class="row"><button class="sec" onclick="go(4)">Back ⬅️</button><button class="pri" onclick="submit()">Launch EcoGlow 🚀</button></div>`}

async function submit(){res=score(A);const p=send();await launch();note="Saving your results...";go(6);note=await p;const n=$("note");if(n)n.textContent=note}
function launch(){return new Promise(done=>{const o=document.createElement("div");o.className="launch";o.innerHTML='<div><div class="rk">🚀</div><h2 id="lm"></h2><div class="lb"><i id="li"></i></div></div>';document.body.appendChild(o);
 const M=["Locking in your price...","Lining up shelves and websites...","Briefing the campaign team...","Sealing the first boxes...","Ten, nine, eight..."];let i=0;
 const tick=()=>{if(i<M.length){$("lm").textContent=M[i];$("li").style.width=((i+1)/M.length*100)+"%";i++}else{clearInterval(t);o.remove();done()}};tick();const t=setInterval(tick,600)})}
async function send(){
 if(SCRIPT_URL.startsWith("PASTE"))return"Results were not saved online because the Google Apps Script web address has not been added to the code yet.";
 const t=x=>D.find(d=>d.k==x).o.find(o=>o.id==A[x]).t;
 const body={timestamp:new Date().toISOString(),team,pricing:t("price"),place:t("place"),promotion:t("promo"),physicalEvidence:t("evid"),
  synergies:res.fx.filter(x=>x[0]>0).map(x=>x[1]),penalties:res.fx.filter(x=>x[0]<0).map(x=>x[1]),
  score:res.total,maxScore:MAX,status:res.total/MAX>=PASS?"Pass":"Fail"};
 try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return"Your results were sent to the class Google Sheet. ✅"}
 catch(e){return"Your results could not be saved online. Please tell your teacher. ⚠️"}}

function results(){
 const{base,fx,total}=res,r=total/MAX,pass=r>=PASS;
 const tier=r>=.75?["Executive Level","🏆","Boardroom legend"]:r>=PASS?["Growth Level","📈","Rising star"]:["High-Risk Level","⚠️","Supply-closet survivor"];
 const P=r>=.75?ME:r>=PASS?MG:MF,msg=P[Math.random()*P.length|0];
 const rev=Math.round(r*250)*1000,cac=Math.round(95-70*r),conv=(0.5+3.5*r).toFixed(1),ret=Math.round(30+60*r);
 const K=[["💵","Monthly sales revenue","$"+rev.toLocaleString(),rev/2500],["🧲","Customer Acquisition Cost","$"+cac,cac/.95],["🛒","Electronic commerce conversion rate",conv+" percent",conv/.04],["💚","Customer retention survey (would buy again)",ret+" percent",ret]];
 return`<h2>Results Dashboard 🎯</h2>
<div class="top"><div class="ring" id="ring"><b id="cnt">0</b><small>of ${MAX}</small></div><div><p style="margin:0">Team <b>${esc(team)}</b> scored</p><p class="big">${total} points</p><p style="margin:0">${Math.round(r*100)} percent of the maximum score</p></div></div>
<div class="res">
<div class="panel pn ${pass?"ok":"no"}"><h3>Product Launch Outcome</h3><p><b>${pass?"Product Launch Successful. 🎉":"Product Launch Failed. 📉"}</b> ${msg}</p><small>The success threshold is ${Math.round(PASS*100)} percent of the maximum score (${Math.ceil(MAX*PASS)} out of ${MAX} points).</small></div>
<div class="panel pn"><h3>Performance Tier</h3><p style="font-size:1.6rem;margin:0;color:var(--brand)"><b>${tier[0]} ${tier[1]}</b><br><small style="color:var(--ink)">${tier[2]}</small></p><div class="callout">Executive Level: ${Math.ceil(MAX*.75)} points or more. Growth Level: ${Math.ceil(MAX*PASS)} to ${Math.ceil(MAX*.75)-1}. High-Risk Level: below ${Math.ceil(MAX*PASS)}.</div></div>
<div class="panel pn"><h3>Control Tools Metrics</h3>${K.map(k=>`<div class="kl"><span>${k[1]}</span><b>${k[2]}</b></div><div class="mb"><i data-w="${Math.min(100,Math.round(k[3]))}"></i></div>`).join("")}<p><small>Simulated figures based on your score.</small></p></div>
<div class="panel pn"><h3>Evaluation Breakdown</h3><p>Base points from your four choices: <b>${base}</b>.</p>
${fx.length?fx.map((x,i)=>`<div class="it ${x[0]>0?"good":"bad"}" style="animation-delay:${.6+i*.15}s"><b>${x[0]>0?"+":""}${x[0]} points, ${x[1]}</b><br>${x[2]}</div>`).join(""):"<p>No synergies or penalties were triggered, so your score comes from base points only.</p>"}</div></div>
<p id="note"><small>${note}</small></p><div class="row"><button class="sec" onclick="restart()">Play again 🔄</button></div>`}
function after(){const r=res.total/MAX;count(res.total,r);setTimeout(()=>document.querySelectorAll(".mb i").forEach(e=>e.style.width=e.dataset.w+"%"),150);burst(r>=PASS)}
function count(t,r){const c=$("cnt"),g=$("ring");let s0=null;const f=n=>{s0=s0||n;const k=Math.min((n-s0)/1400,1),e=1-Math.pow(1-k,3);c.textContent=Math.round(t*e);g.style.setProperty("--p",Math.min(r,1)*100*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function burst(win){const C=win?["#6366f1","#fb7185","#fbbf24","#34d399","#38bdf8"]:["#94a3b8","#475569"];for(let i=0;i<(win?40:14);i++){const e=document.createElement("span");e.className="fx";e.style.cssText=`left:${Math.random()*100}vw;background:${C[i%C.length]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*1.2}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),6500)}}

document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") {
        if (e.key === "Enter" && step === 0 && team.length >= 2) go(1);
        return;
    }
    
    if (e.key === "Backspace" && step > 0 && step <= 5) {
        go(step - 1);
        return;
    }
    
    if (e.key === "Enter") {
        if (step === 0 && team.length >= 2) go(1);
        else if (step >= 1 && step <= 4 && A[D[step-1].k]) go(step + 1);
        else if (step === 5) submit();
        return;
    }
    
    if (step >= 1 && step <= 4) {
        const d = D[step-1], o = d.o[+e.key-1];
        if (o) pick(d.k, o.id);
    }
});

mix();draw();
</script></body></html>
